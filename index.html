<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Spark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conatiner">
    <h1>Find Your Spark ✨</h1>

    <!-- Quote of the Day -->
    <section id="quoteDayContainer">
        <h2>Quote of the Day</h2>

        <p id="dayQuote">
            Quote of the day appears here...
        </p>

        <h4 id="dayAuthor">
            Author name
        </h4>
    </section>

    <!-- Top 5 Quotes -->
    <section id="topQuotesContainer">
        <h2>Top 5 Quotes</h2>

        <ul id="topQuotesList">
            <li>Quotes will appear here...</li>
        </ul>
    </section>

    <!-- Random Quote Section -->
    <section id="randomQuoteContainer">
        <h2>Random Quote</h2>

        <p id="randomQuote">
            Click button to generate quote
        </p>

        <h4 id="randomAuthor">
            Author name
        </h4>
    </section>

    <button id="newQuoteBtn">
        Generate Random Quote
    </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
